plugins {
    id 'java'
    id 'war'
}

group = 'org.example'
version = '6.2.2-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    // Spring Framework核心模块 - 包含@Component等注解
    optional(project(":spring-core"))
    optional(project(":spring-context"))  // 添加spring-context依赖，包含@Component注解
    optional(project(":spring-beans"))    // 添加spring-beans依赖，支持依赖注入
    optional(project(":spring-web"))
    optional(project(":spring-webmvc"))

    // Jakarta EE API支持
    optional("jakarta.annotation:jakarta.annotation-api")
    optional("jakarta.servlet:jakarta.servlet-api")

    // JSON处理支持
    optional("com.fasterxml.jackson.core:jackson-databind:2.18.2")

    // 测试依赖
    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}
